{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{% static '/css/shared_features.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static '/css/login.css' %}">
    <title>legal_marketplace</title>
</head>
{% include "navbar/navbar.html" %}

<body>
    <div class="main-content">
        <div class="login-card shadow" id="loginCard">
            <div class="buttons-wrapper">
                <button class="classic-button" id="loginFormButton">
                    Log In
                </button>
                <button class="classic-button-inverse signup-change-button" id="signupFormButton">
                    Sign Up
                </button>
            </div>
            <div class="login-wrapper" id="loginWrapper">
                <div class="login-text-wrapper">
                    <h1 class="card-title">Log in</h1>
                    <p class="small-p">Not a member of legal_marketplace?</p>
                    <p class="small-p">Create an account <a href="#" id="signupLink">here</a>.</p>
                </div>
                <div class="form-splitter"></div>
                <form action="" class="account-form" method="POST">
                    {% csrf_token %}
                    <div class="login-form-wrapper">
                        <div class="input-wrapper">
                            <label for="emailLogin">Email</label>
                            <input class="signup-login-input" type="text" id="emailLogin" name="email">
                        </div>
                        <div class="input-wrapper">
                            <label for="passwordLogin">Password</label>
                            <input class="signup-login-input" type="password" id="passwordLogin" name="password">
                        </div>
                    </div>
                    <button type="submit" class="classic-button submit-button">
                        Log In
                    </button>
                </form>
            </div>
            <div class="login-wrapper" id="signupWrapper" style="display: none;">
                <div class="login-text-wrapper">
                    <h1 class="card-title">Sign Up</h1>
                    <p>We are delighted to have you join us!</p>
                    <p class="small-p">Already have an account? Log in <a href="#" id="loginLink">here</a>.</p>
                </div>
                <div class="form-splitter"></div>
                <form action="" class="account-form">
                    <div class="login-form-wrapper">
                        <div class="input-wrapper">
                            <label for="emailSignup">Email</label>
                            <input class="signup-login-input" type="text" id="emailSignup">
                        </div>
                        <div class="input-wrapper">
                            <label for="passwordSignup">Password</label>
                            <input class="signup-login-input" type="text" id="passwordSignup">
                        </div>
                        <div class="input-wrapper">
                            <label for="reenterPasswordSignup">Re-enter Password</label>
                            <input class="signup-login-input" type="text" id="reenterPasswordSignup">
                        </div>
                    </div>
                    <button class="classic-button submit-button">
                        Sign Up
                    </button>
                </form>
            </div>
        </div>
    </div>

</body>

{% include "footer/footer.html" %}

</html>

<script src="{% static '/js/login.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

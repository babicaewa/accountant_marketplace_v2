{% load static %}

<head>
  <link rel="stylesheet" type="text/css" href="{% static 'css/navbar.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>

<div class="navbar-wrapper">
  <nav class="navbar bg-light navbar-expand-lg fixed-top bg-body-tertiary custom-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'home' %}">accountant_marketplace</a>
      <button class="navbar-toggler collapsed d-flex d-lg-none flex-column justify-content-around" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="hamburger-layer top-bar"></span>
        <span class="hamburger-layer bottom-bar"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="{% url 'home' %}">
              Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="{% url 'search_results' %}">
              Search
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="{% url 'forum_home' %}">
              Forum
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">
              About
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">
              FAQ
            </a>
          </li>
          {% if user.is_authenticated %}
          <li class="nav-item nav-link">
            <div class="user-info">
              <div class="nav-pfp-wrapper">
                  <img class="nav-pfp" src="{% static 'media/headshot.png' %}" alt="pfp">
                  <i class="bi bi-caret-down-fill"></i>
              </div>
              <div class="profile-info-wrapper">
                <a href="{% url 'visit_portal' %}" class="small-p profile-info-selection">
                  Go to Portal
                </a>
                <hr class="small-divider-hr">
                <a href="{% url 'logout' %}" class="small-p profile-info-selection log-out-selection">
                    Log Out
                    <i class="bi bi-box-arrow-right"></i>
                </a>
              </div>
            </div>
          </li>
          {%else%}
          <li class="nav-item">
            <a href="{% url 'login' %}">
              <button class="classic-button" id="loginNavButton">
                Log in
              </button>
            </a>
          </li>
          {%endif%}
      </div>
    </div>
  </nav>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
